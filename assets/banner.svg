<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity="0.4"/>
    </pattern>

    <!-- Subtle Filters -->
    <filter id="blur-orb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Pulse Animation Keyframes -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 60; }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.45; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        30% { opacity: 0.6; }
        100% { transform: translateY(460px); opacity: 0; }
      }
      .animated-orb-1 {
        animation: glowPulse 7s ease-in-out infinite alternate;
        transform-origin: 200px 150px;
      }
      .animated-orb-2 {
        animation: glowPulse 9s ease-in-out infinite alternate-reverse;
        transform-origin: 1000px 220px;
      }
      .float-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatReverse 7s ease-in-out infinite;
      }
      .pulse-wire {
        stroke-dasharray: 8 12;
        animation: pulseBeam 4s linear infinite;
      }
      .scanner-beam {
        animation: scanline 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="20"/>

  <!-- Glowing Orbs (Dynamic Ambient Lighting in Background) -->
  <circle class="animated-orb-1" cx="220" cy="130" r="160" fill="url(#cyan-glow)" filter="url(#blur-orb)"/>
  <circle class="animated-orb-2" cx="980" cy="240" r="190" fill="url(#purple-glow)" filter="url(#blur-orb)"/>
  <circle cx="600" cy="380" r="140" fill="#3b82f6" fill-opacity="0.15" filter="url(#blur-orb)"/>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#grid)" rx="20"/>

  <!-- Scanning Ray (Subtle Dynamic Overlay behind text) -->
  <g class="scanner-beam">
    <line x1="100" y1="0" x2="1100" y2="0" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.6"/>
  </g>

  <!-- Animated Circuit / Network Flow Lines in Background -->
  <g fill="none" opacity="0.3">
    <path class="pulse-wire" d="M 120 340 C 260 340, 320 280, 420 280" stroke="#38bdf8" stroke-width="2"/>
    <path class="pulse-wire" d="M 780 280 C 880 280, 940 340, 1080 340" stroke="#c084fc" stroke-width="2"/>
    <circle cx="420" cy="280" r="4" fill="#38bdf8"/>
    <circle cx="780" cy="280" r="4" fill="#c084fc"/>
  </g>

  <!-- Ambient Dynamic Side Badges / Floating Elements (Behind main text plane) -->
  <g class="float-card-1" opacity="0.85">
    <!-- Left Feature Node -->
    <rect x="60" y="80" width="160" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#drop-shadow)"/>
    <circle cx="85" cy="106" r="8" fill="#10b981"/>
    <text x="104" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ API Tooling</text>
  </g>

  <g class="float-card-2" opacity="0.85">
    <!-- Right Feature Node -->
    <rect x="980" y="75" width="160" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#drop-shadow)"/>
    <circle cx="1005" cy="101" r="8" fill="#8b5cf6"/>
    <text x="1024" y="106" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 AI Pair Agents</text>
  </g>

  <g class="float-card-1" opacity="0.85">
    <!-- Lower Left Feature Node -->
    <rect x="70" y="270" width="160" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#drop-shadow)"/>
    <circle cx="95" cy="296" r="8" fill="#0ea5e9"/>
    <text x="114" y="301" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🧱 Low-Code Ops</text>
  </g>

  <g class="float-card-2" opacity="0.85">
    <!-- Lower Right Feature Node -->
    <rect x="970" y="275" width="170" height="52" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#drop-shadow)"/>
    <circle cx="995" cy="301" r="8" fill="#f59e0b"/>
    <text x="1014" y="306" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🚀 DevOps Pipelines</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Crisp & High Contrast -->
  <!-- Top Category Pill -->
  <g filter="url(#drop-shadow)">
    <rect x="475" y="48" width="250" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="496" cy="66" r="5" fill="#38bdf8"/>
    <text x="512" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="-0.5" fill="url(#primary-glow)">
    Awesome Developer Tools
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Production-Grade SaaS Platforms &amp; High-Velocity Open-Source Projects
  </text>

  <!-- Feature Pills / Highlights (Foreground) -->
  <g transform="translate(245, 270)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="80" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🌐 API Clients</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="165" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="262" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ Low-Code Builders</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="170" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="450" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">🤖 AI Coding Agents</text>

    <!-- Pill 4 -->
    <rect x="555" y="0" width="155" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>
    <text x="632" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">📑 API Docs &amp; Specs</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="365" x2="900" y2="365" stroke="url(#primary-glow)" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>
