<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".6"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".5"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".35" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="0" r="1.5" fill="#64748b" fill-opacity=".4"/></pattern><filter id="blur-orb" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur stdDeviation="60"/></filter><filter id="drop-shadow" width="130%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".6" stdDeviation="16"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(8px) rotate(-1deg)}}@keyframes pulseBeam{0%{opacity:.3;stroke-dashoffset:0}50%{opacity:.8;stroke-dashoffset:60}}@keyframes glowPulse{0%{opacity:.45;transform:scale(1)}50%{opacity:.75;transform:scale(1.08)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}30%{opacity:.6}}.animated-orb-1{animation:glowPulse 7s ease-in-out infinite alternate;transform-origin:200px 150px}.animated-orb-2{animation:glowPulse 9s ease-in-out infinite alternate-reverse;transform-origin:1000px 220px}.float-card-1{animation:floatSlow 6s ease-in-out infinite}.float-card-2{animation:floatReverse 7s ease-in-out infinite}.pulse-wire{stroke-dasharray:8 12;animation:pulseBeam 4s linear infinite}.scanner-beam{animation:scanline 8s cubic-bezier(.4,0,.2,1) infinite}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="20"/><circle cx="220" cy="130" r="160" fill="url(#cyan-glow)" class="animated-orb-1" filter="url(#blur-orb)"/><circle cx="980" cy="240" r="190" fill="url(#purple-glow)" class="animated-orb-2" filter="url(#blur-orb)"/><circle cx="600" cy="380" r="140" fill="#3b82f6" fill-opacity=".15" filter="url(#blur-orb)"/><rect width="1200" height="420" fill="url(#grid)" rx="20"/><g class="scanner-beam"><line x1="100" x2="1100" y1="0" y2="0" stroke="url(#primary-glow)" stroke-opacity=".6" stroke-width="1.5"/></g><g fill="none" opacity=".3"><path stroke="#38bdf8" stroke-width="2" d="M 120 340 C 260 340, 320 280, 420 280" class="pulse-wire"/><path stroke="#c084fc" stroke-width="2" d="M 780 280 C 880 280, 940 340, 1080 340" class="pulse-wire"/><circle cx="420" cy="280" r="4" fill="#38bdf8"/><circle cx="780" cy="280" r="4" fill="#c084fc"/></g><g class="float-card-1" opacity=".85"><rect width="160" height="52" x="60" y="80" fill="url(#card-grad)" stroke="#334155" stroke-width="1" filter="url(#drop-shadow)" rx="10"/><circle cx="85" cy="106" r="8" fill="#10b981"/><text x="104" y="111" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">⚡ API Tooling</text></g><g class="float-card-2" opacity=".85"><rect width="160" height="52" x="980" y="75" fil